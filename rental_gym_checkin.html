<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="onetre_logo.png?v=2">
<link rel="icon" href="onetre_logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
<link rel="stylesheet" href="rental_gym_cafe.css?v=6">
<title>レンタルジムONE-TRE — 来店チェックイン</title>
</head>
<body data-theme="male">
<script>try{document.body.dataset.theme=localStorage.getItem('rentalTheme')||'male'}catch(e){}</script>
<div class="hero"><div class="hero-in">
  <div class="mark"><span class="wm">ONE-TRE</span><span class="rule"></span><span class="sub">RENTAL GYM</span></div>
  <p class="catch-en">Time just for you</p>
  <p class="catch">じぶんだけの時間</p>
</div></div>
<div class="wrap">
  <h2 class="en">Check in</h2>
  <section id="form">
    <p class="big">来店チェックイン</p>
    <div class="card">
      <div class="f"><label class="l" for="email">会員メールアドレス</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="入会時のメールアドレス"></div>
    </div>
    <button class="btn" id="go">チェックインする</button>
    <p class="msg" id="msg"></p>
  </section>
  <section id="done" class="hidden">
    <p class="big" id="doneTitle"></p>
    <div class="card"><div class="when" id="doneTime"></div><div class="note">ごゆっくりどうぞ。</div></div>
    <div class="card rules"><b>お帰りの前に</b>
      <ul><li>器具を元の位置に戻してください</li><li>照明とエアコンを消してください</li></ul></div>
  </section>
  <p class="foot">レンタルジムONE-TRE<br>鳥取県米子市車尾6丁目8-59-A</p>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxhkgXusWtzEaPt4X_9ys9bJXYV_VdTQoMTGwAXCFqdtiUq-GID17pCgOZbBCCVArgW/exec';
const THEME = { '男性':'male', '女性':'female', 'どちらでもない':'none' };
const $ = id => document.getElementById(id);
function load(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
async function checkin(){
  const email = $('email').value.trim();
  $('msg').textContent = '';
  if(!email){ $('msg').textContent = 'メールアドレスを入力してください'; return; }
  $('go').disabled = true; $('go').textContent = '確認中…';
  try{
    const r = await (await fetch(GAS_URL + '?' + new URLSearchParams({ action:'checkin', email, t:Date.now() }), { cache:'no-store' })).json();
    if(r.gender && THEME[r.gender]){ document.body.dataset.theme = THEME[r.gender]; store('rentalTheme', THEME[r.gender]); }
    if(!r.ok){ $('msg').textContent = r.error; return; }
    store('rentalEmail', email.toLowerCase());
    $('doneTitle').innerHTML = r.name + '様<br>いらっしゃいませ';
    $('doneTime').textContent = r.time;
    $('form').classList.add('hidden'); $('done').classList.remove('hidden');
  }catch(e){ $('msg').textContent = '通信エラーです。もう一度お試しください'; }
  finally{ $('go').disabled = false; $('go').textContent = 'チェックインする'; }
}
$('go').onclick = checkin;
const saved = load('rentalEmail');
if(saved){ $('email').value = saved; checkin(); }
window.addEventListener('pageshow', e => { if(e.persisted) location.reload(); });
</script>
</body>
</html>
