<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="onetre_logo.png?v=1">
<link rel="icon" href="onetre_logo.png?v=1">
<title>レンタルジムONE-TRE — キャンセル</title>
<style>
:root{--ink:#111;--sub:#6b6b6b;--line:#e5e5e5;--gold:#b08d57}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans",sans-serif;background:#fff;color:var(--ink);line-height:1.6;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;align-items:center;gap:12px;padding:20px 0 16px;border-bottom:1px solid var(--ink)}
header img{width:44px;height:44px;object-fit:contain}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.brand b{font-size:20px}
h2{font-size:13px;letter-spacing:.15em;color:var(--sub);margin:28px 0 10px}
.big{font-size:26px;font-weight:700;line-height:1.3}
.card{border:1px solid var(--ink);padding:16px;margin-top:16px}
.when{font-size:22px;font-weight:700}
.btn{display:block;width:100%;padding:16px;font-size:16px;font-weight:700;background:var(--ink);color:#fff;border:0;margin-top:16px;font-family:inherit}
.btn:disabled{background:#c9c9c9}
.note{font-size:12px;color:var(--sub);margin-top:10px}
.msg{font-size:14px;color:#c0392b;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="onetre_logo.png?v=1" alt="ONE-TRE">
    <div class="brand"><small>RENTAL GYM</small><b>レンタルジムONE-TRE</b></div>
  </header>
  <h2>CANCEL</h2>
  <div id="box"><p class="note">読み込み中…</p></div>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxhkgXusWtzEaPt4X_9ys9bJXYV_VdTQoMTGwAXCFqdtiUq-GID17pCgOZbBCCVArgW/exec';
const token = new URLSearchParams(location.search).get('token') || '';
const box = document.getElementById('box');
async function api(p){ p.t = Date.now(); const r = await fetch(GAS_URL + '?' + new URLSearchParams(p).toString(), { cache:'no-store' }); return r.json(); }
(async () => {
  try{
    const r = await api({ action:'getCancelInfo', token });
    if(!r.ok){ box.innerHTML = '<p class="msg">' + r.error + '</p>'; return; }
    if(r.state !== '予約'){ box.innerHTML = '<p class="big">この予約は<br>「' + r.state + '」です</p>'; return; }
    box.innerHTML = '<p class="big">' + r.name + '様<br>ご予約のキャンセル</p><div class="card"><div class="when">' + r.date + ' ' + r.time + '</div></div>' +
      '<button class="btn" id="go">キャンセルする</button><p class="msg" id="m"></p>';
    document.getElementById('go').onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = '処理中…';
      try{
        const c = await api({ action:'cancel', token });
        if(!c.ok){ document.getElementById('m').textContent = c.error; e.target.disabled = false; e.target.textContent = 'キャンセルする'; return; }
        box.innerHTML = '<p class="big">キャンセル<br>しました</p><p class="note">確認メールを送りました。</p><a class="btn" style="text-align:center;text-decoration:none" href="rental_gym_yoyaku.html">予約画面へ</a>';
      }catch(err){ document.getElementById('m').textContent = '通信エラーです。もう一度お試しください'; e.target.disabled = false; e.target.textContent = 'キャンセルする'; }
    };
  }catch(e){ box.innerHTML = '<p class="msg">通信エラーです。再読み込みしてください</p>'; }
})();
window.addEventListener('pageshow', e => { if(e.persisted) location.reload(); });
</script>
</body>
</html>
