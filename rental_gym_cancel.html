<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="onetre_logo.png?v=2">
<link rel="icon" href="onetre_logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
<link rel="stylesheet" href="rental_gym_cafe.css?v=6">
<title>レンタルジムONE-TRE — キャンセル</title>
</head>
<body data-theme="male">
<script>try{document.body.dataset.theme=localStorage.getItem('rentalTheme')||'male'}catch(e){}</script>
<div class="hero"><div class="hero-in">
  <div class="mark"><span class="wm">ONE-TRE</span><span class="rule"></span><span class="sub">RENTAL GYM</span></div>
  <p class="catch-en">Time just for you</p>
  <p class="catch">じぶんだけの時間</p>
</div></div>
<div class="wrap">
  <h2 class="en">Cancel</h2>
  <div id="box"><p class="loading">読み込み中…</p></div>
  <p class="foot">レンタルジムONE-TRE<br>鳥取県米子市車尾6丁目8-59-A</p>
</div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxhkgXusWtzEaPt4X_9ys9bJXYV_VdTQoMTGwAXCFqdtiUq-GID17pCgOZbBCCVArgW/exec';
const THEME = { '男性':'male', '女性':'female', 'どちらでもない':'none' };
const token = new URLSearchParams(location.search).get('token') || '';
const box = document.getElementById('box');
async function api(p){ p.t = Date.now(); const r = await fetch(GAS_URL + '?' + new URLSearchParams(p).toString(), { cache:'no-store' }); return r.json(); }
(async () => {
  try{
    const r = await api({ action:'getCancelInfo', token });
    if(r.gender && THEME[r.gender]){ document.body.dataset.theme = THEME[r.gender]; try{ localStorage.setItem('rentalTheme', THEME[r.gender]); }catch(e){} }
    if(!r.ok){ box.innerHTML = '<p class="msg">' + r.error + '</p>'; return; }
    if(r.state !== '予約'){ box.innerHTML = '<p class="big">この予約は<br>「' + r.state + '」です</p>'; return; }
    box.innerHTML = '<p class="big">' + r.name + '様<br>ご予約のキャンセル</p><div class="card"><div class="when">' + r.date + ' ' + r.time + '</div></div>' +
      '<button class="btn" id="go">キャンセルする</button><p class="msg" id="m"></p>';
    document.getElementById('go').onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = '処理中…';
      try{
        const c = await api({ action:'cancel', token });
        if(!c.ok){ document.getElementById('m').textContent = c.error; e.target.disabled = false; e.target.textContent = 'キャンセルする'; return; }
        box.innerHTML = '<p class="big">キャンセル<br>しました</p><p class="note">確認メールを送りました。</p><a class="btn" href="rental_gym_yoyaku.html">予約画面へ</a>';
      }catch(err){ document.getElementById('m').textContent = '通信エラーです。もう一度お試しください'; e.target.disabled = false; e.target.textContent = 'キャンセルする'; }
    };
  }catch(e){ box.innerHTML = '<p class="msg">通信エラーです。再読み込みしてください</p>'; }
})();
window.addEventListener('pageshow', e => { if(e.persisted) location.reload(); });
</script>
</body>
</html>
