<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="onetre_logo.png?v=2">
<link rel="icon" href="onetre_logo.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&display=swap">
<title>ONE-TRE — はじめての方</title>
<style>
:root{--paper:#F7F2EA;--card:#FFFDF9;--ink:#1E1915;--sub:#7A6E62;--gold:#A8854F;--line:#E2D7C6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;background:var(--paper);color:var(--ink);line-height:1.7;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
.mark{display:inline-flex;flex-direction:column;line-height:1}
.mark .wm{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:28px;letter-spacing:.14em}
.mark .rule{height:1px;background:var(--ink);margin:7px 0 6px}
.mark .sub{font-family:"Cormorant Garamond",serif;font-size:11px;letter-spacing:.5em;color:var(--sub)}
.en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;color:var(--gold);margin-top:30px}
h1{font-size:30px;font-weight:800;letter-spacing:.06em;line-height:1.3}
.lead{font-size:14px;color:var(--sub);margin-top:6px}
.choice{display:block;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit}
.choice:active{transform:scale(.99)}
.ph{height:190px;background-size:cover;background-position:center}
.ct{padding:18px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.tag{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:14px;letter-spacing:.32em;color:var(--gold)}
.ttl{font-size:24px;font-weight:800;letter-spacing:.05em;line-height:1.35;margin-top:2px}
.desc{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.7}
.arr{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.arr svg{width:22px;height:22px}
.which{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--sub)}
.which b{color:var(--ink)}
.which li{list-style:none;margin-top:6px}
.foot{font-size:12px;color:var(--sub);margin-top:30px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark"><span class="wm">ONE-TRE</span><span class="rule"></span><span class="sub">YONAGO</span></div>
  <p class="en">Welcome</p>
  <h1>はじめての方へ</h1>
  <p class="lead">ご希望に合わせて、どちらかをお選びください。</p>

  <a class="choice" href="taiken_yoyaku.html">
    <div class="ph" style="background-image:url(onetre_personal_photo.jpg?v=1);background-position:40% 30%"></div>
    <div class="ct">
      <div><div class="tag">PERSONAL</div><div class="ttl">パーソナル体験予約</div>
        <div class="desc">トレーナーがマンツーマンで指導します。運動が初めての方も安心の40分体験。</div></div>
      <div class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="#1E1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>
  </a>

  <a class="choice" href="rental_gym_nyukai.html">
    <div class="ph" style="background-image:url(rental_gym_room.jpg?v=2);background-position:30% 60%"></div>
    <div class="ct">
      <div><div class="tag">RENTAL</div><div class="ttl">レンタルジム入会</div>
        <div class="desc">個室ジムを、じぶんだけの時間に。月額・使い放題、スマホで予約できます。</div></div>
      <div class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="#1E1915" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </div>
  </a>

  <ul class="which">
    <li><b>やり方を教わりたい方</b> → パーソナル体験</li>
    <li><b>自分のペースで鍛えたい方</b> → レンタルジム</li>
  </ul>

  <p class="foot">ONE-TRE<br>鳥取県米子市車尾6丁目8-59-A</p>
</div>
<script>
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 350) e.preventDefault(); lastTouch = n; }, { passive:false });
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
</script>
</body>
</html>
